<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Flexbox</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f0f0f0;padding:20px}
.container{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.cubo1,.cubo2,.cubo3,.cubo4,.cubo5,.cubo6,.cubo7,.cubo8{width:150px;height:150px;background:white;border:2px solid #333;border-radius:10px;display:flex;padding:10px}
.caixinhas{width:30px;height:30px;background:#6c5ce7;border-radius:5px}
.cubo1{justify-content:flex-start;align-items:flex-start;gap:5px}
.cubo2{justify-content:flex-end;align-items:flex-end;gap:5px}
.cubo3{justify-content:center;align-items:center;gap:5px}
.cubo4{flex-direction:column;justify-content:space-between}
.cubo5{flex-direction:column;justify-content:center;align-items:center;gap:5px}
.cubo6{justify-content:space-between;align-items:center}
.cubo7{flex-wrap:wrap;justify-content:space-between;align-content:space-between}
.cubo8{flex-wrap:wrap;justify-content:space-around;align-content:space-around}
.cubo8 .caixinhas{width:45%;height:45%}
</style>
</head>
<body>
<div class="container">
<div class="cubo1"><div class="caixinhas"></div><div class="caixinhas"></div><div class="caixinhas"></div><div class="caixinhas"></div></div>
<div class="cubo2"><div class="caixinhas"></div><div class="caixinhas"></div><div class="caixinhas"></div><div class="caixinhas"></div></div>
<div class="cubo3"><div class="caixinhas"></div><div class="caixinhas"></div><div class="caixinhas"></div><div class="caixinhas"></div></div>
<div class="cubo4"><div class="caixinhas"></div><div class="caixinhas"></div><div class="caixinhas"></div><div class="caixinhas"></div></div>
<div class="cubo5"><div class="caixinhas"></div><div class="caixinhas"></div><div class="caixinhas"></div><div class="caixinhas"></div></div>
<div class="cubo6"><div class="caixinhas"></div><div class="caixinhas"></div><div class="caixinhas"></div><div class="caixinhas"></div></div>
<div class="cubo7"><div class="caixinhas"></div><div class="caixinhas"></div><div class="caixinhas"></div><div class="caixinhas"></div></div>
<div class="cubo8"><div class="caixinhas"></div><div class="caixinhas"></div><div class="caixinhas"></div><div class="caixinhas"></div></div>
</div>
</body>
</html>
